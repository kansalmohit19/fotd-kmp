name: CI-Android

on:
  push:
    branches:
      - master
  pull_request:

concurrency: #cancel per branch
  group: ci-android${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle Cache
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > androidApp/google-services.json

      - name: Build & Verify
        run: ./gradlew :shared:build :androidApp:lint test check --parallel --build-cache